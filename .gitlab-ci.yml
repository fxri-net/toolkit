# GitLab CI：完整检查（test）+ 文档站构建部署（pages）
# test 的验收步骤清单唯一真源是 scripts/verify.mjs，此处只调用，不在 CI 里另写一份步骤，避免清单漂移
# 作业镜像由 ci-templates 依据 .ci/toolchain.json 动态构建，仓库内不再安装 Node 与 pnpm
# VITEPRESS_BASE 按平台域名注入：gitlab.io 项目页为 /toolkit/（可按实际仓库名调整），自托管域名可设为 /
# 私有站回链/canonical 由 SITE_URL/REPO_URL 注入（值放 GitLab CI/CD 变量，不写进仓库；不注入则回链 GitHub 主仓库）
include:
  - project: fxri/develop/0001.base/ci-templates
    ref: main
    file: /dynamic-image.yml

# 全部作业只在默认分支执行，工具链作业随之收敛，避免分支推送反复触发镜像构建
# 连续推送时取消过期流水线：旧提交的检查结果已无意义，只保留最新一次
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - test
  - deploy

test:
  # 与 .node-version 对齐，避免与 GitHub Actions 两侧 node 版本漂移
  image:
    name: $CI_IMAGE
    pull_policy: if-not-present
  stage: test
  interruptible: true
  needs:
    - toolchain:spec
    - toolchain:ensure
  script:
    - pnpm verify
  # 文档产物由 pages 复用，避免同一流水线构建两次文档站
  artifacts:
    paths:
      - docs/.vitepress/dist
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  image:
    name: $CI_IMAGE
    pull_policy: if-not-present
  stage: deploy
  interruptible: true
  # 复用 test 的文档产物：产物缺失时明确失败，不静默产出空站点
  needs:
    - job: test
      artifacts: true
  script:
    - test -d docs/.vitepress/dist
    - rm -rf public && mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - package.json
        - pnpm-lock.yaml
        - .gitlab-ci.yml
